<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 - Track Not Found | VibeVault</title>
  <meta name="description" content="Oops! This karaoke track or private room does not exist. Return to VibeVault stage or explore our 12 themed suites.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brand: { dark: '#0B0914', surface: '#120E24', card: '#181236', purple: '#8B5CF6' },
            neon: { pink: '#FF007F', cyan: '#00F0FF', purple: '#A855F7', orange: '#FF5E3A' }
          },
          fontFamily: { display: ['Outfit', 'sans-serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Fast Theme & Direction Initializer -->
  <script>
    (function() {
      try {
        const t = localStorage.getItem('vox_theme');
        const theme = t ? JSON.parse(t) : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
        const d = localStorage.getItem('vox_direction');
        if (d) {
          const dir = JSON.parse(d);
          document.documentElement.setAttribute('dir', dir);
          if (dir === 'rtl') document.documentElement.classList.add('rtl');
        }
      } catch(e) {}
    })();
  </script>

  <!-- Custom Theme Styles with Cache Busting -->
  <link rel="stylesheet" href="assets/css/main.css?v=3.7">
</head>
<body class="antialiased min-h-screen flex flex-col justify-between selection:bg-pink-600 selection:text-white">

  <!-- Navbar Mount Point -->
  <div id="navbar-mount"></div>

  <!-- 404 Main Center Content -->
  <main class="flex-1 flex items-center justify-center pt-28 pb-16 px-4 relative overflow-hidden">
    <!-- Ambient Glows -->
    <div class="ambient-glow-pink top-1/4 -left-20 opacity-40"></div>
    <div class="ambient-glow-cyan bottom-1/4 -right-20 opacity-40"></div>

    <div class="max-w-xl w-full text-center space-y-6 relative z-10 glass-panel p-8 sm:p-12 rounded-3xl border border-purple-800/50 shadow-2xl">
      
      <!-- Graphic Icon & Equalizer -->
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-purple-950/80 border border-purple-700/60 shadow-[0_0_30px_rgba(255,0,127,0.4)] text-rose-400 text-4xl mb-2 animate-bounce-slow">
        <i class="bi bi-mic-mute-fill"></i>
      </div>

      <!-- 404 Gradient Number -->
      <h1 class="font-display font-black text-7xl sm:text-9xl tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400">
        404
      </h1>

      <div class="space-y-2">
        <h2 class="font-display font-bold text-2xl text-white">Oops! Track Not Found</h2>
        <p class="text-xs sm:text-sm text-slate-300 max-w-md mx-auto leading-relaxed">
          Looks like someone pulled the microphone cord or this suite has moved to a different channel. Let’s get you back into the groove.
        </p>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
        <a href="index.html" class="btn-neon-primary px-7 py-3 text-xs w-full sm:w-auto shadow-[0_0_20px_rgba(255,0,127,0.4)]">
          <i class="bi bi-house-door-fill mr-1"></i> Back to Main Stage
        </a>
        <a href="rooms.html" class="btn-neon-outline px-7 py-3 text-xs w-full sm:w-auto">
          <i class="bi bi-disc mr-1"></i> Explore Themed Rooms
        </a>
      </div>

    </div>
  </main>

  <!-- Footer Mount Point -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="assets/js/data/images.js"></script>
  <script src="assets/js/data/rooms-data.js"></script>
  <script src="assets/js/data/packages-data.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/main.js"></script>

</body>
</html>
